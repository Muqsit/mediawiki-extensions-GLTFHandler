name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  composer-test:
    name: Composer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Run Composer tests
        run: composer test

  phan:
    name: Phan
    runs-on: ubuntu-latest
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: REL1_46
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ast
          tools: composer
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install extension dependencies
        working-directory: mediawiki/extensions/GLTFHandler
        run: composer install --no-interaction --no-progress
      - name: Run Phan
        working-directory: mediawiki/extensions/GLTFHandler
        run: composer phan

  npm-test:
    name: npm tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run npm tests
        run: npm test

  browser-test:
    name: Browser integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: REL1_46
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: intl, mbstring, sqlite3
          tools: composer
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mediawiki/extensions/GLTFHandler/package-lock.json
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install MediaWiki
        working-directory: mediawiki
        run: >-
          php maintenance/install.php
          --dbtype sqlite
          --dbpath "${{ runner.temp }}"
          --dbname mediawiki
          --server http://127.0.0.1:8080
          --scriptpath ""
          --lang en
          --pass AdminPassword123!
          TestWiki Admin
      - name: Enable GLTFHandler
        working-directory: mediawiki
        run: printf "\nwfLoadExtension( 'GLTFHandler' );\n\$wgEnableUploads = true;\n" >> LocalSettings.php
      - name: Install browser-test dependencies
        working-directory: mediawiki/extensions/GLTFHandler
        run: npm ci
      - name: Verify model-viewer browser build
        working-directory: mediawiki/extensions/GLTFHandler
        run: |
          npm run build:model-viewer
          git diff --exit-code -- resources/ext.gltfHandler/model-viewer-umd.min.js resources/ext.gltfHandler/decoders
      - name: Install Chromium
        working-directory: mediawiki/extensions/GLTFHandler
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: mediawiki/extensions/GLTFHandler
        env:
          MW_SERVER_URL: http://127.0.0.1:8080
          MW_USERNAME: Admin
          MW_PASSWORD: AdminPassword123!
          PLAYWRIGHT_WEB_SERVER_COMMAND: php -S 127.0.0.1:8080 -t ../..
        run: npm run test:e2e

  phpunit:
    name: PHPUnit (MediaWiki ${{ matrix.mediawiki }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki: '1.43'
            ref: REL1_43
            php: '8.1'
            phpunit-config: phpunit.xml.dist
          - mediawiki: '1.46'
            ref: REL1_46
            php: '8.5'
            phpunit-config: phpunit.xml.template
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.ref }}
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: intl, mbstring, sqlite3
          tools: composer
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install MediaWiki
        working-directory: mediawiki
        run: >-
          php maintenance/install.php
          --dbtype sqlite
          --dbpath "${{ runner.temp }}"
          --dbname mediawiki
          --server http://localhost
          --scriptpath ""
          --lang en
          --pass AdminPassword123!
          TestWiki Admin
      - name: Enable GLTFHandler
        working-directory: mediawiki
        run: printf "\nwfLoadExtension( 'GLTFHandler' );\n" >> LocalSettings.php
      - name: Run extension PHPUnit tests
        working-directory: mediawiki
        run: |
          sed -i '/<coverage[ >]/,/<\/coverage>/d' "${{ matrix.phpunit-config }}"
          composer phpunit:entrypoint -- --configuration "${{ matrix.phpunit-config }}" --testdox --coverage-filter extensions/GLTFHandler/src --coverage-html extensions/GLTFHandler/coverage --coverage-clover extensions/GLTFHandler/coverage/coverage.xml extensions/GLTFHandler/tests/phpunit
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mw${{ matrix.mediawiki }}-php${{ matrix.php }}
          path: mediawiki/extensions/GLTFHandler/coverage
          if-no-files-found: error

  coverage-pages:
    name: Publish coverage
    needs: phpunit
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: coverage-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-mw1.43-php8.1
          path: coverage
      - name: Generate coverage badge
        run: |
          metrics=$(yq -p xml --xml-attribute-prefix '' -o json '.coverage.project.metrics' coverage/coverage.xml)
          jq '(100 * (.coveredstatements | tonumber) / (.statements | tonumber)) as $p | {schemaVersion: 1, label: "coverage", message: ((($p * 100 | round) / 100 | tostring) + "%"), color: (if $p <= 50 then "red" elif $p < 90 then "yellow" else "green" end)}' <<< "$metrics" > coverage/badge.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: coverage
      - uses: actions/deploy-pages@v4
        id: deployment
