name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  composer-test:
    name: Composer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Run Composer tests
        run: composer test

  phan:
    name: Phan
    runs-on: ubuntu-latest
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: REL1_46
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ast
          tools: composer
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install extension dependencies
        working-directory: mediawiki/extensions/GLTFHandler
        run: composer install --no-interaction --no-progress
      - name: Run Phan
        working-directory: mediawiki/extensions/GLTFHandler
        run: composer phan

  npm-test:
    name: npm tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run npm tests
        run: npm test

  browser-test:
    name: Browser integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: REL1_46
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: intl, mbstring, sqlite3
          tools: composer
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mediawiki/extensions/GLTFHandler/package-lock.json
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install MediaWiki
        working-directory: mediawiki
        run: >-
          php maintenance/install.php
          --dbtype sqlite
          --dbpath "${{ runner.temp }}"
          --dbname mediawiki
          --server http://127.0.0.1:8080
          --scriptpath ""
          --lang en
          --pass AdminPassword123!
          TestWiki Admin
      - name: Enable GLTFHandler
        working-directory: mediawiki
        run: printf "\nwfLoadExtension( 'GLTFHandler' );\n\$wgEnableUploads = true;\n" >> LocalSettings.php
      - name: Install browser-test dependencies
        working-directory: mediawiki/extensions/GLTFHandler
        run: npm ci
      - name: Verify model-viewer browser build
        working-directory: mediawiki/extensions/GLTFHandler
        run: |
          npm run build:model-viewer
          git diff --exit-code -- resources/ext.gltfHandler/model-viewer-umd.min.js resources/ext.gltfHandler/decoders
      - name: Install Chromium
        working-directory: mediawiki/extensions/GLTFHandler
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: mediawiki/extensions/GLTFHandler
        env:
          MW_SERVER_URL: http://127.0.0.1:8080
          MW_USERNAME: Admin
          MW_PASSWORD: AdminPassword123!
          PLAYWRIGHT_WEB_SERVER_COMMAND: php -S 127.0.0.1:8080 -t ../..
        run: npm run test:e2e

  phpunit:
    name: PHPUnit (MediaWiki ${{ matrix.mediawiki }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki: '1.43'
            ref: REL1_43
            php: '8.1'
          - mediawiki: '1.46'
            ref: REL1_46
            php: '8.5'
    steps:
      - name: Check out MediaWiki
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.ref }}
          path: mediawiki
      - name: Check out GLTFHandler
        uses: actions/checkout@v7
        with:
          path: mediawiki/extensions/GLTFHandler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: intl, mbstring, sqlite3
          tools: composer
      - name: Install Assimp
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends assimp-utils
      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-interaction --no-progress
      - name: Install MediaWiki
        working-directory: mediawiki
        run: >-
          php maintenance/install.php
          --dbtype sqlite
          --dbpath "${{ runner.temp }}"
          --dbname mediawiki
          --server http://localhost
          --scriptpath ""
          --lang en
          --pass AdminPassword123!
          TestWiki Admin
      - name: Enable GLTFHandler
        working-directory: mediawiki
        run: printf "\nwfLoadExtension( 'GLTFHandler' );\n" >> LocalSettings.php
      - name: Run extension PHPUnit tests
        working-directory: mediawiki
        run: composer phpunit:entrypoint -- --testdox extensions/GLTFHandler/tests/phpunit
